[project]
name = "payment-initiation"
version = "1.0.0"
description = "BIAN Payment Initiation Service Domain (channel/BFF) — accepts pain.001."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "iso20022",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
