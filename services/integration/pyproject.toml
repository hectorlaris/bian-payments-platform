[project]
name = "payments-integration"
version = "1.0.0"
description = "Kafka -> EventBridge bridge and integration event routing for Payments."
requires-python = ">=3.12"
dependencies = [
    "iso20022",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
