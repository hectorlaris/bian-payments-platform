[project]
name = "iso20022"
version = "1.0.0"
description = "ISO 20022 DTOs (pain.001, pacs.008, pacs.002) and mappings — MVP subset."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
