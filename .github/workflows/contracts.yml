name: API Contracts

on:
  push:
    branches: [main]
    paths:
      - "apis/**"
      - "docs/architecture/**"
      - ".spectral.yaml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "apis/**"
      - "docs/architecture/**"
      - ".spectral.yaml"
      - ".github/workflows/contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint OpenAPI with Spectral
        run: npx -y @stoplight/spectral-cli@latest lint "apis/*.openapi.yaml" --ruleset .spectral.yaml

      - name: Validate structure
        run: python scripts/validate_structure.py

      - name: Validate example payloads
        run: |
          python -m pip install pyyaml jsonschema
          python scripts/validate_examples.py

      - name: Validate architecture diagrams
        run: python scripts/check_mermaid.py
