name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "services/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - services/shared/iso20022_python
          - services/payment-initiation
          - services/payment-execution/rail-adapter
          - services/integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared library
        run: python -m pip install -e services/shared/iso20022_python

      - name: Install package under test
        run: python -m pip install -e "${{ matrix.package }}[dev]"

      - name: Lint with Ruff
        run: |
          python -m pip install ruff
          python -m ruff check "${{ matrix.package }}"

      - name: Run tests
        run: python -m pytest "${{ matrix.package }}" -q
