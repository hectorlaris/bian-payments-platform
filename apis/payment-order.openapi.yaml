openapi: 3.1.0
info:
  title: Payment Order API
  version: 1.0.0
  description: >-
    BIAN Service Domain: Payment Order. Order fulfillment: validates and builds ISO
    20022 pacs.008, orchestrates the payment Saga, and exposes the event-sourced
    control record and its read projection. BIAN Semantic API verbs: Retrieve, Update,
    Control.
  contact:
    name: Payments Platform Team
servers:
  - url: https://api.example-bank.com/payment-order/v1
    description: Controlled environment
tags:
  - name: PaymentOrder
    description: BIAN control record - Payment Order
paths:
  /payment-orders/{paymentId}:
    get:
      tags: [PaymentOrder]
      operationId: retrievePaymentOrder
      summary: Retrieve the payment order (BIAN Retrieve)
      description: Return the current state of the event-sourced payment order.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment order control record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrderState'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: './components/iso20022.yaml#/components/schemas/Problem'
      security:
        - oauth2: [payments.read]
    put:
      tags: [PaymentOrder]
      operationId: updatePaymentOrder
      summary: Update the payment order (BIAN Update)
      description: Amend a payment order that is still in a modifiable state.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOrderUpdate'
      responses:
        '200':
          description: Updated control record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrderState'
        '409':
          description: Order is no longer modifiable.
          content:
            application/json:
              schema:
                $ref: './components/iso20022.yaml#/components/schemas/Problem'
      security:
        - oauth2: [payments.write]
  /payment-orders/{paymentId}/control:
    post:
      tags: [PaymentOrder]
      operationId: controlPaymentOrder
      summary: Control the payment order lifecycle (BIAN Control)
      description: Apply a lifecycle action such as cancel to the payment order.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlAction'
      responses:
        '200':
          description: Control action applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrderState'
        '409':
          description: Action not allowed in current state.
          content:
            application/json:
              schema:
                $ref: './components/iso20022.yaml#/components/schemas/Problem'
      security:
        - oauth2: [payments.write]
  /payment-orders/{paymentId}/events:
    get:
      tags: [PaymentOrder]
      operationId: retrievePaymentOrderEvents
      summary: Retrieve the event stream (BIAN Retrieve - behavior qualifier)
      description: Return the ordered domain events for auditability (Event Sourcing).
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The ordered event stream.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainEvent'
      security:
        - oauth2: [payments.read]
components:
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: The payment aggregate id (idempotency key).
      schema:
        type: string
        format: uuid
  schemas:
    PaymentOrderState:
      type: object
      description: Read view of the event-sourced Payment Order aggregate.
      required: [paymentId, status, version]
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          $ref: './components/iso20022.yaml#/components/schemas/TransactionStatus'
        version:
          type: integer
          description: Number of events applied to the aggregate.
        pacs008:
          $ref: './components/iso20022.yaml#/components/schemas/Pacs008'
    PaymentOrderUpdate:
      type: object
      description: Amendable fields of a payment order.
      properties:
        remittanceInformation:
          type: string
          maxLength: 140
    ControlAction:
      type: object
      description: A lifecycle control action.
      required: [action]
      properties:
        action:
          type: string
          enum: [cancel]
        reason:
          type: string
    DomainEvent:
      type: object
      description: A persisted domain event (Event Sourcing envelope).
      required: [eventId, eventType, occurredAt, paymentId, schemaVersion]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        paymentId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        schemaVersion:
          type: integer
        payload:
          type: object
          additionalProperties: true
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 / OIDC via Cognito.
      flows:
        clientCredentials:
          tokenUrl: https://auth.example-bank.com/oauth2/token
          scopes:
            payments.read: Read payment state
            payments.write: Modify payment orders
